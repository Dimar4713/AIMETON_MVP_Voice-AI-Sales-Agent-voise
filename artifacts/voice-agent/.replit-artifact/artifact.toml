kind = "web"
previewPath = "/"
title = "Voice AI Sales Agent"
description = "A full-stack voice AI sales agent app. Users securely store their ElevenLabs API key on the server, create an AI sales agent via ElevenLabs API, and have real-time voice conversations through a WebSocket connection. The frontend never sees the raw API key — all ElevenLabs calls are proxied through the backend."
version = "1.0.0"
id = "artifacts/voice-agent"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20599

[services.development]
run = "pnpm --filter @workspace/voice-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voice-agent", "run", "build" ]
serve = "static"
publicDir = "artifacts/voice-agent/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20599"
BASE_PATH = "/"
